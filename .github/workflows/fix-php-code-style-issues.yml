name: Fix PHP code style issues

on:
  push:
    paths:
      - '**.php'

permissions:
  contents: write

jobs:
  phplint:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
      - name: "laravel-pint"
        uses: aglipanci/laravel-pint-action@2.6
        with:
          preset: laravel
          verboseMode: true
          testMode: false
          configPath: "pint.json"
      
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: ":+1: Use pint to fix styling"
          push_options: --force
